<!doctype html>
<html lang="vi">
<head>
<!-- Speaking can ban 1: Am cuoi. Ban offline mot file, tao bang build-single.js. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking căn bản 1: Âm cuối</title>
<meta name="description" content="Bài giảng tương tác về năm âm cuối /t/, /d/, /k/, /s/, /z/ trong tiếng Anh: nghe mẫu, minigame và luyện đọc có ghi âm.">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Âm cuối">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Speaking can ban 1: Am cuoi
   =========================================================== */

:root {
  --bg: #f6f7fb;
  --bg-2: #ffffff;
  --bg-soft: #eef1f8;
  --ink: #141a2a;
  --ink-2: #4a5568;
  --ink-3: #8a93a6;
  --line: #e2e6f0;
  --brand: #4338ca;
  --brand-soft: #eef0ff;
  --ok: #15803d;
  --ok-soft: #e7f6ec;
  --no: #c2334d;
  --no-soft: #fdecef;
  --shadow: 0 1px 2px rgba(20, 26, 42, .05), 0 12px 30px rgba(20, 26, 42, .07);
  --shadow-sm: 0 1px 2px rgba(20, 26, 42, .06), 0 4px 12px rgba(20, 26, 42, .05);
  --r: 18px;
  --t: 140ms;
  --btn-ink: #ffffff;
  --c-t: #e07a3f;
  --c-d: #8b5cf6;
  --c-k: #0d9488;
  --c-s: #2563eb;
  --c-z: #db2777;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017;
    --bg-2: #161a24;
    --bg-soft: #1d2230;
    --ink: #eef1f8;
    --ink-2: #b3bbcc;
    --ink-3: #7d869b;
    --line: #272d3c;
    --brand: #a5b4fc;
    --brand-soft: #1f2436;
    --ok: #6ee7a8;
    --ok-soft: #122a1e;
    --no: #fca5b5;
    --no-soft: #2d1620;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px rgba(0, 0, 0, .45);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
    --btn-ink: #10131c;
    --c-t: #f0975f;
    --c-d: #a78bfa;
    --c-k: #2dd4bf;
    --c-s: #60a5fa;
    --c-z: #f472b6;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1017;
  --bg-2: #161a24;
  --bg-soft: #1d2230;
  --ink: #eef1f8;
  --ink-2: #b3bbcc;
  --ink-3: #7d869b;
  --line: #272d3c;
  --brand: #a5b4fc;
  --brand-soft: #1f2436;
  --ok: #6ee7a8;
  --ok-soft: #122a1e;
  --no: #fca5b5;
  --no-soft: #2d1620;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px rgba(0, 0, 0, .45);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .3);
  --btn-ink: #10131c;
  --c-t: #f0975f;
  --c-d: #a78bfa;
  --c-k: #2dd4bf;
  --c-s: #60a5fa;
  --c-z: #f472b6;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Be Vietnam Pro', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(60rem 36rem at 86% -12%, color-mix(in srgb, var(--c-z) 14%, transparent), transparent 70%),
    radial-gradient(52rem 34rem at -8% 8%, color-mix(in srgb, var(--c-s) 16%, transparent), transparent 70%),
    radial-gradient(44rem 30rem at 50% 118%, color-mix(in srgb, var(--c-k) 13%, transparent), transparent 70%);
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- Thanh tien do ---------- */
.progress {
  position: fixed; top: 0; left: 0; right: 0; height: 4px;
  background: transparent; z-index: 60;
}
.progress__bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--c-s), var(--c-z), var(--c-t));
  border-radius: 0 4px 4px 0;
  transition: width 420ms cubic-bezier(.22, 1, .36, 1);
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand__mark {
  width: 34px; height: 34px; flex: none; border-radius: 11px;
  display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff;
  background: linear-gradient(135deg, var(--c-s), var(--c-z));
  box-shadow: var(--shadow-sm);
}
.brand__txt { min-width: 0; }
.brand__t { font-weight: 700; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand__s { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; }

.tool {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg-2); color: var(--ink-2);
  font-size: 13px; font-weight: 600;
  transition: transform var(--t), border-color var(--t), color var(--t);
}
.tool:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); color: var(--ink); }
.tool--icon { padding: 0; width: 36px; justify-content: center; font-size: 15px; }
select.tool { max-width: 180px; }

@media (max-width: 760px) {
  .hide-sm { display: none !important; }
  .brand__s { display: none; }
}

/* ---------- Deck ---------- */
.deck {
  position: relative; z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 16px 120px;
}
.slide { display: none; }
.slide.is-active { display: block; animation: slideIn 420ms cubic-bezier(.22, 1, .36, 1) both; }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(18px) scale(.995); }
  to { opacity: 1; transform: none; }
}

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--brand);
  background: var(--brand-soft);
  padding: 6px 12px; border-radius: 999px; margin-bottom: 14px;
}
h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.12; margin: 0 0 14px; letter-spacing: -.02em; font-weight: 800; }
h2 { font-size: clamp(23px, 4.2vw, 33px); line-height: 1.2; margin: 0 0 10px; letter-spacing: -.015em; font-weight: 800; }
h3 { font-size: 17px; margin: 0 0 8px; font-weight: 700; }
.lead { font-size: clamp(16px, 2.2vw, 18.5px); color: var(--ink-2); margin: 0 0 22px; max-width: 62ch; }
p { margin: 0 0 12px; }

.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.grid { display: grid; gap: 14px; }
.grid--2 { grid-template-columns: repeat(2, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .grid--2, .grid--3 { grid-template-columns: 1fr; } }

.reveal { opacity: 0; transform: translateY(14px); animation: rise 520ms cubic-bezier(.22, 1, .36, 1) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* ---------- Nut ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: 13px; border: 1px solid transparent;
  font-weight: 700; font-size: 14.5px;
  background: var(--brand); color: var(--btn-ink);
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: transform var(--t), filter var(--t), background var(--t);
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn:active { transform: translateY(0) scale(.98); }
.btn--ghost { background: var(--bg-2); color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn--ghost:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.btn--rec { background: var(--no); color: var(--btn-ink); }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- The am ---------- */
.sound-chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 52px; height: 36px; padding: 0 12px;
  border-radius: 11px; font-weight: 800; font-size: 16px;
  background: color-mix(in srgb, var(--c) 16%, var(--bg-2));
  color: var(--c);
  border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
}

.soundcard {
  position: relative; overflow: hidden;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; text-align: left;
  box-shadow: var(--shadow-sm);
  transition: transform 220ms cubic-bezier(.22, 1, .36, 1), box-shadow 220ms, border-color 220ms;
  width: 100%;
}
.soundcard::after {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c);
  transform: scaleY(.25); transform-origin: center; transition: transform 240ms;
}
.soundcard:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }
.soundcard:hover::after { transform: scaleY(1); }
.soundcard__ipa { font-size: 30px; font-weight: 800; color: var(--c); line-height: 1; }
.soundcard__kind { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin-top: 4px; }
.soundcard__ex { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; }

/* ---------- Tu co the bam nghe ---------- */
.wordbtn {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 10px 14px; border-radius: 12px;
  background: var(--bg-soft); border: 1px solid var(--line);
  font-weight: 600; font-size: 15.5px;
  transition: transform var(--t), background var(--t), border-color var(--t);
}
.wordbtn:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c, var(--brand)) 45%, var(--line)); }
.wordbtn.is-playing { background: color-mix(in srgb, var(--c, var(--brand)) 18%, var(--bg-2)); animation: pulse 700ms ease; }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.wordbtn .tail { color: var(--c, var(--brand)); border-bottom: 3px solid var(--c, var(--brand)); border-radius: 2px; }
.wordbtn .vi { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.wordrow { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Bang quy tac ---------- */
.rule { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: start; padding: 16px 0; border-top: 1px solid var(--line); }
.rule:first-child { border-top: 0; }
.rule__out { font-size: 24px; font-weight: 800; color: var(--c); }
.rule__when { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }

/* ---------- Minigame ---------- */
.gamebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.stat {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; border-radius: 999px;
  background: var(--bg-soft); border: 1px solid var(--line);
  font-size: 13px; font-weight: 700; color: var(--ink-2);
}
.stat b { color: var(--ink); font-size: 14px; }
.stat.is-hot { background: color-mix(in srgb, var(--c-t) 16%, var(--bg-2)); border-color: color-mix(in srgb, var(--c-t) 40%, transparent); color: var(--c-t); animation: pop 320ms; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }

.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.choice {
  flex: 1 1 110px; min-width: 100px;
  padding: 18px 12px; border-radius: 15px;
  border: 2px solid var(--line); background: var(--bg-2);
  font-size: 24px; font-weight: 800; color: var(--c, var(--ink));
  transition: transform 160ms cubic-bezier(.22, 1, .36, 1), border-color 160ms, background 160ms;
}
.choice:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c, var(--brand)) 55%, var(--line)); }
.choice small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 4px; }
.choice.is-right { border-color: var(--ok); background: var(--ok-soft); animation: pop 340ms; }
.choice.is-wrong { border-color: var(--no); background: var(--no-soft); animation: shake 380ms; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
}

.feedback { min-height: 58px; margin-top: 16px; font-weight: 600; }
.feedback__in { padding: 13px 16px; border-radius: 13px; animation: rise 300ms cubic-bezier(.22,1,.36,1) both; }
.feedback__in.ok { background: var(--ok-soft); color: var(--ok); }
.feedback__in.no { background: var(--no-soft); color: var(--no); }

.speaker-wrap { display: grid; place-items: center; padding: 22px 0 10px; }
.speaker {
  width: 118px; height: 118px; border-radius: 50%;
  display: grid; place-items: center; font-size: 42px;
  background: linear-gradient(135deg, var(--c-s), var(--c-z));
  color: #fff; border: 0;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--c-s) 35%, transparent);
  transition: transform 180ms;
}
.speaker:hover { transform: scale(1.05); }
.speaker.is-playing { animation: ripple 1.1s ease-out infinite; }
@keyframes ripple {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-s) 42%, transparent); }
  100% { box-shadow: 0 0 0 28px transparent; }
}

/* ---------- Keo tha ---------- */
.chiprow { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; padding: 12px; border-radius: 14px; background: var(--bg-soft); border: 1px dashed var(--line); }
.chip {
  padding: 10px 15px; border-radius: 11px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-weight: 700; font-size: 15px; cursor: grab;
  box-shadow: var(--shadow-sm);
  transition: transform 160ms, border-color 160ms, opacity 160ms;
}
.chip:hover { transform: translateY(-2px); }
.chip.is-picked { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-3px) scale(1.04); }
.chip.is-dragging { opacity: .4; }
.chip.is-right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); cursor: default; }
.chip.is-wrong { animation: shake 380ms; border-color: var(--no); }

.bins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
@media (max-width: 760px) { .bins { grid-template-columns: repeat(2, 1fr); } }
.bin {
  border: 2px dashed color-mix(in srgb, var(--c) 40%, var(--line));
  border-radius: 15px; padding: 12px; min-height: 130px;
  background: color-mix(in srgb, var(--c) 7%, var(--bg-2));
  transition: transform 160ms, background 160ms, border-color 160ms;
}
.bin.is-over { transform: scale(1.03); border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--bg-2)); }
.bin__h { font-weight: 800; color: var(--c); font-size: 19px; text-align: center; margin-bottom: 8px; }
.bin__list { display: flex; flex-direction: column; gap: 7px; }
.bin__list .chip { font-size: 13.5px; padding: 7px 10px; text-align: center; }

/* ---------- Doan van ---------- */
.passage { font-size: clamp(18px, 2.6vw, 23px); line-height: 2.1; letter-spacing: .005em; }
.pw { display: inline-block; padding: 1px 2px; border-radius: 6px; transition: background 160ms, transform 160ms; }
.pw.is-on { background: color-mix(in srgb, var(--brand) 20%, transparent); transform: translateY(-2px); }
.pw .tail { color: var(--c); font-weight: 700; border-bottom: 3px solid var(--c); border-radius: 2px; }
.psent { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.psent__play {
  flex: none; margin-top: 7px;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink-2);
  display: grid; place-items: center; font-size: 12px;
  transition: transform var(--t), background var(--t), color var(--t);
}
.psent__play:hover { transform: scale(1.1); background: var(--brand-soft); color: var(--brand); }
.psent__play.is-on { background: var(--brand); color: var(--btn-ink); border-color: transparent; }
.pw .pt { color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.legend__i { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--c); }
.legend__i i { width: 11px; height: 11px; border-radius: 3px; background: var(--c); display: inline-block; }

.audio-slot { margin-top: 14px; }
.audio-slot audio { width: 100%; }

/* ---------- Checklist ---------- */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check__n { flex: none; width: 27px; height: 27px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 13px; }

/* ---------- Navbar duoi ---------- */
.navbar {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 55; display: flex; align-items: center; gap: 8px;
  padding: 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--bg-2) 92%, transparent);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  max-width: calc(100vw - 24px);
}
.nav-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 0; background: var(--bg-soft); color: var(--ink);
  display: grid; place-items: center; font-size: 17px;
  transition: transform var(--t), background var(--t);
}
.nav-btn:hover { transform: scale(1.08); background: var(--brand-soft); color: var(--brand); }
.nav-btn[disabled] { opacity: .35; pointer-events: none; }
.dots { display: flex; gap: 5px; padding: 0 4px; overflow: hidden; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 0; background: var(--line); transition: all 220ms; padding: 0; }
.dot:hover { transform: scale(1.4); }
.dot.is-on { width: 24px; border-radius: 999px; background: linear-gradient(90deg, var(--c-s), var(--c-z)); }
@media (max-width: 560px) { .dots { display: none; } }
.navpos { font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 0 8px; white-space: nowrap; }

/* ---------- Muc luc ---------- */
.menu {
  position: fixed; inset: 0; z-index: 70;
  background: color-mix(in srgb, var(--ink) 40%, transparent);
  backdrop-filter: blur(6px);
  display: none; padding: 24px 16px; overflow: auto;
}
.menu.is-open { display: block; animation: rise 220ms ease both; }
.menu__panel { max-width: 640px; margin: 40px auto; background: var(--bg-2); border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.menu__h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.menu__item { display: flex; gap: 13px; align-items: center; width: 100%; text-align: left; padding: 13px 22px; background: none; border: 0; border-top: 1px solid var(--line); transition: background var(--t); }
.menu__item:hover { background: var(--bg-soft); }
.menu__item.is-on { background: var(--brand-soft); }
.menu__n { flex: none; width: 27px; height: 27px; border-radius: 9px; background: var(--bg-soft); display: grid; place-items: center; font-size: 12.5px; font-weight: 800; color: var(--ink-3); }
.menu__item.is-on .menu__n { background: var(--brand); color: var(--bg-2); }

/* ---------- Phao hoa khi tra loi dung ---------- */
.spark { position: fixed; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; z-index: 80; }

.muted { color: var(--ink-3); font-size: 13.5px; }
.kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>

<div class="progress"><div class="progress__bar" id="progressBar"></div></div>

<header class="topbar">
  <div class="brand">
    <div class="brand__mark">âm</div>
    <div class="brand__txt">

<script>
/* ===========================================================
   Speech: doc mau bang giong trinh duyet (Web Speech API)
   Recorder: thu am qua micro de hoc vien tu so sanh
   =========================================================== */

const Speech = (function () {
  let voices = [];
  let current = null;
  let rate = 0.85;
  const listeners = [];

  function score(v) {
    const n = (v.name || '').toLowerCase();
    let p = 0;
    if (/^en[-_]gb/i.test(v.lang)) p += 60;
    else if (/^en[-_]us/i.test(v.lang)) p += 50;
    else if (/^en/i.test(v.lang)) p += 30;
    else return -1;
    if (/google/.test(n)) p += 25;
    if (/natural|neural|premium|enhanced/.test(n)) p += 20;
    if (/samantha|daniel|karen|serena|aria|libby/.test(n)) p += 10;
    if (/compact|eloquence/.test(n)) p -= 10;
    return p;
  }

  function refresh() {
    const all = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    voices = all.filter(function (v) { return /^en/i.test(v.lang); })
                .sort(function (a, b) { return score(b) - score(a); });
    if (!current && voices.length) current = voices[0];
    listeners.forEach(function (fn) { fn(voices, current); });
  }

  if (window.speechSynthesis) {
    refresh();
    window.speechSynthesis.onvoiceschanged = refresh;
    setTimeout(refresh, 400);
  }

  function supported() {
    return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  }

  function stop() {
    if (supported()) window.speechSynthesis.cancel();
  }

  /* say(text, options)
     options: { rate, onend, onboundary, slow } */
  function say(text, options) {
    options = options || {};
    if (!supported()) {
      if (options.onend) options.onend();
      return null;
    }
    stop();
    const u = new SpeechSynthesisUtterance(text);
    if (current) { u.voice = current; u.lang = current.lang; }
    else u.lang = 'en-GB';
    u.rate = options.rate || (options.slow ? Math.max(0.5, rate - 0.25) : rate);
    u.pitch = 1;
    if (options.onend) u.onend = options.onend;
    if (options.onboundary) u.onboundary = options.onboundary;
    /* Chrome doi khi treo hang doi sau khi tab mat focus */
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(u);
    return u;
  }

  function onVoices(fn) {
    listeners.push(fn);
    if (voices.length) fn(voices, current);
  }

  return {
    say: say,
    stop: stop,
    supported: supported,
    onVoices: onVoices,
    getVoices: function () { return voices; },
    setVoice: function (name) {
      const v = voices.find(function (x) { return x.name === name; });
      if (v) current = v;
    },
    getRate: function () { return rate; },
    setRate: function (r) { rate = r; }
  };
})();

const Recorder = (function () {
  let media = null;
  let chunks = [];
  let stream = null;
  let lastUrl = null;

  function supported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  async function start() {
    if (!supported()) throw new Error('unsupported');
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    media = new MediaRecorder(stream);
    media.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    media.start();
  }

  function stop() {
    return new Promise(function (resolve) {
      if (!media) return resolve(null);
      media.onstop = function () {
        const blob = new Blob(chunks, { type: media.mimeType || 'audio/webm' });
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        media = null;
        resolve(lastUrl);
      };
      media.stop();
    });
  }

  function isRecording() {
    return !!(media && media.state === 'recording');
  }

  return { supported: supported, start: start, stop: stop, isRecording: isRecording };
})();

<script>
/* ===========================================================
   Cac ham dung chung cho giao dien
   =========================================================== */

/* h('div.card', {attr}, child, child...) */
function h(spec, attrs) {
  const parts = String(spec).split(/(?=[.#])/);
  const el = document.createElement(parts[0] || 'div');
  parts.slice(1).forEach(function (p) {
    if (p[0] === '.') el.classList.add(p.slice(1));
    else if (p[0] === '#') el.id = p.slice(1);
  });
  let start = 1;
  if (attrs && attrs.constructor === Object) {
    start = 2;
    Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (k === 'style' && typeof v === 'object') setStyle(el, v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
    });
  }
  for (let i = start; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}

/* Custom property (--x) phai dung setProperty, Object.assign khong nhan */
function setStyle(el, obj) {
  Object.keys(obj).forEach(function (k) {
    if (k.indexOf('--') === 0) el.style.setProperty(k, obj[k]);
    else el.style[k] = obj[k];
  });
}

function append(parent, node) {
  if (node === null || node === undefined || node === false) return;
  if (Array.isArray(node)) return node.forEach(function (n) { append(parent, n); });
  parent.appendChild(node.nodeType ? node : document.createTextNode(String(node)));
}

function soundVar(key) { return 'var(--c-' + key + ')'; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* Tach tu thanh phan dau va phan duoi duoc to mau */
function splitTail(word, n) {
  if (!n) return [word, ''];
  return [word.slice(0, word.length - n), word.slice(word.length - n)];
}

/* Nut tu vung co the bam de nghe */
function wordButton(word, soundKey, vi, tailLen) {
  const tail = tailLen === undefined ? defaultTail(word, soundKey) : tailLen;
  const parts = splitTail(word, tail);
  const btn = h('button.wordbtn', {
    style: { '--c': soundVar(soundKey) },
    type: 'button',
    'aria-label': 'Nghe từ ' + word
  },
    h('span', {}, parts[0], parts[1] ? h('span.tail', { text: parts[1] }) : null),
    vi ? h('span.vi', { text: vi }) : null
  );
  btn.addEventListener('click', function () {
    document.querySelectorAll('.wordbtn.is-playing').forEach(function (e) { e.classList.remove('is-playing'); });
    btn.classList.add('is-playing');
    Speech.say(word, { onend: function () { btn.classList.remove('is-playing'); } });
    setTimeout(function () { btn.classList.remove('is-playing'); }, 2200);
  });
  return btn;
}

/* Doan chu cuoi tuong ung voi am cuoi, dung cho hien thi */
function defaultTail(word, key) {
  const w = word.replace(/[.,!?]/g, '').toLowerCase();
  if (key === 's' || key === 'z') {
    if (/ce$/.test(w)) return 2;
    if (/se$/.test(w)) return 2;
    return 1;
  }
  if (key === 'k') {
    if (/ck$/.test(w)) return 2;
    if (/ke$/.test(w)) return 2;
    return 1;
  }
  if (key === 't' || key === 'd') {
    if (/te$|de$/.test(w)) return 2;
    return 1;
  }
  return 1;
}

/* Hieu ung hat sang khi tra loi dung */
function sparkle(target) {
  const r = target.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const colors = ['var(--c-t)', 'var(--c-d)', 'var(--c-k)', 'var(--c-s)', 'var(--c-z)'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.background = colors[i % colors.length];
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    document.body.appendChild(s);
    const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.5;
    const dist = 70 + Math.random() * 90;
    s.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: 'translate(' + (Math.cos(ang) * dist - 50) + '%,' + (Math.sin(ang) * dist + 40) + '%) scale(0)', opacity: 0 }
    ], { duration: 700 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' })
      .onfinish = function () { s.remove(); };
  }
}

/* Khoi cham diem dung chung cho cac minigame */
function scoreBar(labels) {
  const score = h('b', { text: '0' });
  const total = h('b', { text: '0' });
  const streak = h('b', { text: '0' });
  const streakBox = h('span.stat', {}, '🔥 Chuỗi đúng ', streak);
  const bar = h('div.gamebar', {},
    h('span.stat', {}, '✅ Đúng ', score, ' / ', total),
    streakBox,
    labels || null
  );
  return {
    el: bar,
    mark: function (ok) {
      total.textContent = String(Number(total.textContent) + 1);
      if (ok) {
        score.textContent = String(Number(score.textContent) + 1);
        streak.textContent = String(Number(streak.textContent) + 1);
        if (Number(streak.textContent) >= 3) {
          streakBox.classList.remove('is-hot');
          void streakBox.offsetWidth;
          streakBox.classList.add('is-hot');
        }
      } else {
        streak.textContent = '0';
        streakBox.classList.remove('is-hot');
      }
    },
    reset: function () { score.textContent = '0'; total.textContent = '0'; streak.textContent = '0'; streakBox.classList.remove('is-hot'); }
  };
}

<script>
/* ===========================================================
   Bon hoat dong tuong tac cua bai hoc
   =========================================================== */

const Games = {};

/* -----------------------------------------------------------
   1. Nghe va chon am cuoi
   ----------------------------------------------------------- */
Games.listen = function () {
  let queue = shuffle(GAME_WORDS);
  let i = 0;
  let locked = false;

  const sc = scoreBar();
  const speaker = h('button.speaker', { type: 'button', 'aria-label': 'Phát từ' }, '🔊');
  const hint = h('p.muted', { style: { textAlign: 'center' }, text: 'Bấm loa để nghe lại. Sau đó chọn âm cuối bạn nghe được.' });
  const feedback = h('div.feedback');
  const choices = h('div.choices');
  const nextBtn = h('button.btn', { type: 'button', style: { display: 'none' } }, 'Từ tiếp theo →');

  SOUND_ORDER.forEach(function (k) {
    const s = SOUNDS[k];
    const b = h('button.choice', { type: 'button', style: { '--c': soundVar(k) } },
      s.ipa, h('small', { text: s.kind.split(',')[1] ? s.kind.split(',')[1].trim() : s.kind }));
    b.dataset.key = k;
    b.addEventListener('click', function () { answer(k, b); });
    choices.appendChild(b);
  });

  function play() {
    speaker.classList.add('is-playing');
    Speech.say(queue[i].w, { onend: function () { speaker.classList.remove('is-playing'); } });
    setTimeout(function () { speaker.classList.remove('is-playing'); }, 2200);
  }

  function answer(key, btn) {
    if (locked) return;
    locked = true;
    const item = queue[i];
    const ok = key === item.s;
    btn.classList.add(ok ? 'is-right' : 'is-wrong');
    if (!ok) {
      const right = choices.querySelector('[data-key="' + item.s + '"]');
      if (right) right.classList.add('is-right');
    } else {
      sparkle(btn);
    }
    sc.mark(ok);
    const tail = defaultTail(item.w, item.s);
    const parts = splitTail(item.w, tail);
    feedback.innerHTML = '';
    feedback.appendChild(h('div.feedback__in', { class: 'feedback__in ' + (ok ? 'ok' : 'no') },
      ok ? '✅ Chính xác. ' : '❌ Chưa đúng. ',
      'Từ vừa nghe là ',
      h('b', {}, parts[0], h('span', { style: { textDecoration: 'underline' } }, parts[1])),
      ' kết thúc bằng ' + SOUNDS[item.s].ipa + '.'
    ));
    nextBtn.style.display = '';
  }

  function next() {
    i = (i + 1) % queue.length;
    if (i === 0) queue = shuffle(queue);
    locked = false;
    feedback.innerHTML = '';
    nextBtn.style.display = 'none';
    choices.querySelectorAll('.choice').forEach(function (b) { b.classList.remove('is-right', 'is-wrong'); });
    play();
  }

  speaker.addEventListener('click', play);
  nextBtn.addEventListener('click', next);

  return h('div', {},
    sc.el,
    h('div.card', {},
      h('div.speaker-wrap', {}, speaker),
      hint,
      choices,
      feedback,
      h('div', { style: { textAlign: 'center' } }, nextBtn)
    )
  );
};

/* -----------------------------------------------------------
   2. Keo tha phan loai tu theo am cuoi
   ----------------------------------------------------------- */
Games.sort = function () {
  const sc = scoreBar();
  const pool = h('div.chiprow');
  const bins = h('div.bins');
  const msg = h('div.feedback');
  let picked = null;
  let left = 0;

  function place(chip, key, binEl) {
    const ok = chip.dataset.sound === key;
    sc.mark(ok);
    if (ok) {
      chip.classList.remove('is-picked');
      chip.classList.add('is-right');
      chip.draggable = false;
      binEl.querySelector('.bin__list').appendChild(chip);
      sparkle(chip);
      left--;
      Speech.say(chip.dataset.word);
      msg.innerHTML = '';
      if (left === 0) {
        msg.appendChild(h('div.feedback__in.ok', {}, '🎉 Xong hết rồi. Bấm "Ván mới" để đổi bộ từ khác.'));
      }
    } else {
      chip.classList.remove('is-picked');
      chip.classList.add('is-wrong');
      setTimeout(function () { chip.classList.remove('is-wrong'); }, 420);
      msg.innerHTML = '';
      msg.appendChild(h('div.feedback__in.no', {}, '❌ "' + chip.dataset.word + '" chưa thuộc nhóm ' + SOUNDS[key].ipa + '. Nghe lại rồi thử nhóm khác.'));
      Speech.say(chip.dataset.word);
    }
    picked = null;
  }

  SOUND_ORDER.forEach(function (k) {
    const bin = h('div.bin', { style: { '--c': soundVar(k) } },
      h('div.bin__h', { text: SOUNDS[k].ipa }),
      h('div.bin__list')
    );
    bin.addEventListener('dragover', function (e) { e.preventDefault(); bin.classList.add('is-over'); });
    bin.addEventListener('dragleave', function () { bin.classList.remove('is-over'); });
    bin.addEventListener('drop', function (e) {
      e.preventDefault();
      bin.classList.remove('is-over');
      const id = e.dataTransfer.getData('text/plain');
      const chip = pool.querySelector('[data-id="' + id + '"]');
      if (chip) place(chip, k, bin);
    });
    bin.addEventListener('click', function () {
      if (picked) place(picked, k, bin);
    });
    bins.appendChild(bin);
  });

  function deal() {
    pool.innerHTML = '';
    msg.innerHTML = '';
    sc.reset();
    bins.querySelectorAll('.bin__list').forEach(function (l) { l.innerHTML = ''; });
    const chosen = [];
    SOUND_ORDER.forEach(function (k) {
      const sameSound = shuffle(GAME_WORDS.filter(function (x) { return x.s === k; }));
      chosen.push(sameSound[0], sameSound[1]);
    });
    left = chosen.length;
    shuffle(chosen).forEach(function (item, idx) {
      const chip = h('div.chip', { draggable: 'true', text: item.w, title: 'Bấm để nghe, rồi bấm vào ô nhóm âm' });
      chip.dataset.id = 'c' + idx;
      chip.dataset.sound = item.s;
      chip.dataset.word = item.w;
      chip.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', chip.dataset.id);
        chip.classList.add('is-dragging');
      });
      chip.addEventListener('dragend', function () { chip.classList.remove('is-dragging'); });
      chip.addEventListener('click', function () {
        if (chip.classList.contains('is-right')) { Speech.say(item.w); return; }
        pool.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-picked'); });
        if (picked === chip) { picked = null; return; }
        picked = chip;
        chip.classList.add('is-picked');
        Speech.say(item.w);
      });
      pool.appendChild(chip);
    });
  }

  const again = h('button.btn.btn--ghost', { type: 'button', onclick: deal }, '🔀 Ván mới');
  deal();

  return h('div', {},
    sc.el,
    h('div.card', {},
      h('p.muted', {}, 'Bấm vào từ để nghe, rồi bấm vào ô nhóm âm tương ứng. Trên máy tính bạn cũng có thể kéo thả.'),
      pool,
      bins,
      msg,
      h('div', { style: { textAlign: 'center', marginTop: '6px' } }, again)
    )
  );
};

/* -----------------------------------------------------------
   3. Cap tu khac nhau o am cuoi
   ----------------------------------------------------------- */
Games.pairs = function () {
  const sc = scoreBar();
  let queue = shuffle(MINIMAL_PAIRS);
  let i = 0;
  let target = null;
  let locked = false;

  const speaker = h('button.speaker', { type: 'button', 'aria-label': 'Phát từ' }, '🎧');
  const row = h('div.choices');
  const feedback = h('div.feedback');
  const nextBtn = h('button.btn', { type: 'button', style: { display: 'none' } }, 'Cặp tiếp theo →');
  const compare = h('button.btn.btn--ghost', { type: 'button' }, '🔁 Nghe lần lượt cả hai');

  function playTarget() {
    speaker.classList.add('is-playing');
    Speech.say(target.word, { onend: function () { speaker.classList.remove('is-playing'); } });
    setTimeout(function () { speaker.classList.remove('is-playing'); }, 2000);
  }

  function render() {
    const p = queue[i];
    target = Math.random() < 0.5
      ? { word: p.a, sound: p.sa }
      : { word: p.b, sound: p.sb };
    row.innerHTML = '';
    [[p.a, p.sa, p.via], [p.b, p.sb, p.vib]].forEach(function (x) {
      const tail = defaultTail(x[0], x[1]);
      const parts = splitTail(x[0], tail);
      const b = h('button.choice', { type: 'button', style: { '--c': soundVar(x[1]) } },
        h('span', {}, parts[0], h('span', { style: { borderBottom: '3px solid ' + soundVar(x[1]) } }, parts[1])),
        h('small', { text: SOUNDS[x[1]].ipa + ' · ' + x[2] })
      );
      b.dataset.word = x[0];
      b.addEventListener('click', function () { answer(x[0], b); });
      row.appendChild(b);
    });
    feedback.innerHTML = '';
    nextBtn.style.display = 'none';
    locked = false;
    playTarget();
  }

  function answer(word, btn) {
    if (locked) return;
    locked = true;
    const ok = word === target.word;
    btn.classList.add(ok ? 'is-right' : 'is-wrong');
    if (!ok) {
      const right = row.querySelector('[data-word="' + target.word + '"]');
      if (right) right.classList.add('is-right');
    } else sparkle(btn);
    sc.mark(ok);
    feedback.innerHTML = '';
    feedback.appendChild(h('div', { class: 'feedback__in ' + (ok ? 'ok' : 'no') },
      (ok ? '✅ Đúng rồi. ' : '❌ Chưa đúng. ') + 'Từ vừa phát là "' + target.word + '", âm cuối ' + SOUNDS[target.sound].ipa + '.'
    ));
    nextBtn.style.display = '';
  }

  compare.addEventListener('click', function () {
    const p = queue[i];
    Speech.say(p.a, { onend: function () { setTimeout(function () { Speech.say(p.b); }, 350); } });
  });
  speaker.addEventListener('click', playTarget);
  nextBtn.addEventListener('click', function () {
    i = (i + 1) % queue.length;
    if (i === 0) queue = shuffle(queue);
    render();
  });

  const box = h('div', {},
    sc.el,
    h('div.card', {},
      h('div.speaker-wrap', {}, speaker),
      h('p.muted', { style: { textAlign: 'center' } }, 'Hai từ chỉ khác nhau đúng một âm cuối. Bạn vừa nghe từ nào?'),
      row,
      feedback,
      h('div', { style: { textAlign: 'center', display: 'flex', gap: '10px', justifyContent: 'center', flexWrap: 'wrap' } }, nextBtn, compare)
    )
  );
  render();
  return box;
};

/* -----------------------------------------------------------
   4. Doc doan van co danh dau am cuoi
   ----------------------------------------------------------- */
Games.passage = function () {
  const sentences = [];
  const wrap = h('div.passage');

  PASSAGE.forEach(function (sent, si) {
    const words = [];
    const line = h('div');
    sent.forEach(function (tok, wi) {
      /* Tach dau cau ra khoi phan chu duoc to mau */
      const m = String(tok[0]).match(/^(.*?)([.,!?;:]*)$/);
      const core = m[1];
      const punct = m[2];
      const parts = splitTail(core, tok[1]);
      const span = h('span.pw', { style: { '--c': tok[2] ? soundVar(tok[2]) : 'var(--ink)' } },
        parts[0],
        parts[1] ? h('span.tail', { text: parts[1] }) : null,
        punct ? h('span.pt', { text: punct }) : null);
      span.addEventListener('click', function () { Speech.say(core); });
      span.style.cursor = 'pointer';
      words.push(span);
      line.appendChild(span);
      if (wi < sent.length - 1) line.appendChild(document.createTextNode(' '));
    });
    const playOne = h('button.psent__play', { type: 'button', title: 'Nghe câu này', 'aria-label': 'Nghe câu ' + (si + 1) }, '▶');
    playOne.addEventListener('click', function () { speakSentence(si); });
    wrap.appendChild(h('div.psent', {}, playOne, line));
    sentences.push({ words: words, text: sent.map(function (t) { return t[0]; }).join(' '), btn: playOne });
  });

  let timer = null;
  let playingAll = false;

  function clearMarks() {
    if (timer) { clearInterval(timer); timer = null; }
    wrap.querySelectorAll('.pw.is-on').forEach(function (e) { e.classList.remove('is-on'); });
    wrap.querySelectorAll('.psent__play.is-on').forEach(function (e) { e.classList.remove('is-on'); });
  }

  function speakSentence(si, onDone) {
    clearMarks();
    const s = sentences[si];
    s.btn.classList.add('is-on');
    let boundaryWorks = false;
    const starts = [];
    let acc = 0;
    s.words.forEach(function (w, idx) {
      starts.push(acc);
      acc += s.text.split(' ')[idx].length + 1;
    });

    function mark(idx) {
      s.words.forEach(function (w, k) { w.classList.toggle('is-on', k === idx); });
    }

    /* Du phong cho trinh duyet khong ban su kien boundary */
    let k = 0;
    const est = Math.max(220, (s.text.length * 62) / (Speech.getRate() || 0.85) / s.words.length);
    timer = setInterval(function () {
      if (boundaryWorks) return;
      if (k >= s.words.length) { clearInterval(timer); timer = null; return; }
      mark(k); k++;
    }, est);

    Speech.say(s.text, {
      onboundary: function (e) {
        if (e.name && e.name !== 'word') return;
        boundaryWorks = true;
        let idx = 0;
        for (let j = 0; j < starts.length; j++) if (e.charIndex >= starts[j]) idx = j;
        mark(idx);
      },
      onend: function () {
        clearMarks();
        if (onDone) onDone();
      }
    });
  }

  function playAll() {
    playingAll = true;
    let si = 0;
    (function step() {
      if (!playingAll || si >= sentences.length) { playingAll = false; clearMarks(); return; }
      speakSentence(si, function () { si++; setTimeout(step, 420); });
    })();
  }

  const btnAll = h('button.btn', { type: 'button' }, '▶ Nghe mẫu cả đoạn');
  const btnStop = h('button.btn.btn--ghost', { type: 'button' }, '⏹ Dừng');
  btnAll.addEventListener('click', playAll);
  btnStop.addEventListener('click', function () { playingAll = false; Speech.stop(); clearMarks(); });

  /* Ghi am */
  const recBtn = h('button.btn.btn--rec', { type: 'button' }, '🎙 Ghi âm giọng bạn');
  const slot = h('div.audio-slot');
  const recMsg = h('p.muted');

  if (location.protocol === 'file:') {
    recBtn.disabled = true;
    recMsg.textContent = 'Bạn đang mở bằng file trên máy nên trình duyệt chặn micro. Phần nghe mẫu vẫn dùng bình thường. Muốn ghi âm thì mở bài giảng qua đường dẫn https hoặc localhost.';
  } else if (!Recorder.supported()) {
    recBtn.disabled = true;
    recMsg.textContent = 'Trình duyệt này không hỗ trợ ghi âm. Hãy thử Chrome, Edge hoặc Safari bản mới.';
  }

  recBtn.addEventListener('click', async function () {
    if (Recorder.isRecording()) {
      const url = await Recorder.stop();
      recBtn.textContent = '🎙 Ghi âm lại';
      recBtn.classList.add('btn--ghost');
      recBtn.classList.remove('btn--rec');
      slot.innerHTML = '';
      slot.appendChild(h('audio', { controls: 'controls', src: url }));
      recMsg.textContent = 'Nghe lại và tự hỏi: mình có nghe rõ âm cuối ở các chữ được tô màu không?';
      return;
    }
    try {
      Speech.stop(); clearMarks(); playingAll = false;
      await Recorder.start();
      recBtn.textContent = '⏹ Dừng ghi âm';
      recBtn.classList.remove('btn--ghost');
      recBtn.classList.add('btn--rec');
      recMsg.textContent = 'Đang ghi âm. Đọc chậm, chạm rõ từng âm cuối đã tô màu.';
    } catch (err) {
      recMsg.textContent = 'Không truy cập được micro. Hãy cho phép quyền micro trong trình duyệt rồi thử lại.';
    }
  });

  const legend = h('div.legend', {}, SOUND_ORDER.map(function (k) {
    return h('span.legend__i', { style: { '--c': soundVar(k) } }, h('i'), SOUNDS[k].ipa);
  }));

  return h('div', {},
    legend,
    h('div.card', {}, wrap),
    h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', marginTop: '16px' } }, btnAll, btnStop, recBtn),
    slot,
    recMsg,
    h('details', { style: { marginTop: '16px' } },
      h('summary', { style: { cursor: 'pointer', fontWeight: '700', color: 'var(--ink-2)' } }, 'Xem nghĩa tiếng Việt'),
      h('p.muted', { style: { marginTop: '10px' }, text: PASSAGE_VI })
    )
  );
};

</script>
<script>

/* ---------- Dieu huong ---------- */
const Deck = (function () {
  const deck = document.getElementById('deck');
  const bar = document.getElementById('progressBar');
  const dots = document.getElementById('dots');
  const pos = document.getElementById('navpos');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const menu = document.getElementById('menu');
  const menuList = document.getElementById('menuList');
  const built = [];
  let idx = 0;

  SLIDES.forEach(function (s, i) {
    const sec = h('section.slide', { id: 'slide-' + i, 'aria-label': s.title });
    deck.appendChild(sec);
    const dot = h('button.dot', { type: 'button', title: s.title, onclick: function () { go(i); } });
    dots.appendChild(dot);
    const item = h('button.menu__item', { type: 'button', onclick: function () { go(i); closeMenu(); } },
      h('span.menu__n', { text: String(i + 1) }), h('span', { text: s.title }));
    menuList.appendChild(item);
  });

  function go(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    Speech.stop();
    idx = i;
    const sec = document.getElementById('slide-' + i);
    if (!built[i]) {
      sec.appendChild(SLIDES[i].build());
      built[i] = true;
    }
    deck.querySelectorAll('.slide').forEach(function (s) { s.classList.remove('is-active'); });
    sec.classList.add('is-active');
    bar.style.width = ((i + 1) / SLIDES.length * 100) + '%';
    pos.textContent = (i + 1) + ' / ' + SLIDES.length;
    prev.disabled = i === 0;
    next.disabled = i === SLIDES.length - 1;
    dots.querySelectorAll('.dot').forEach(function (d, k) { d.classList.toggle('is-on', k === i); });
    menuList.querySelectorAll('.menu__item').forEach(function (d, k) { d.classList.toggle('is-on', k === i); });
    history.replaceState(null, '', '#' + (i + 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeMenu() { menu.classList.remove('is-open'); }

  prev.addEventListener('click', function () { go(idx - 1); });
  next.addEventListener('click', function () { go(idx + 1); });
  document.getElementById('menuBtn').addEventListener('click', function () { menu.classList.add('is-open'); });
  document.getElementById('menuClose').addEventListener('click', closeMenu);
  menu.addEventListener('click', function (e) { if (e.target === menu) closeMenu(); });

  document.addEventListener('keydown', function (e) {
    if (/input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(idx + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(idx - 1);
    if (e.key === 'Escape') closeMenu();
  });

  let touchX = null;
  deck.addEventListener('touchstart', function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 70) go(idx + (dx < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });

  const start = Math.max(0, (parseInt(location.hash.replace('#', ''), 10) || 1) - 1);
  go(start);

  return { go: go, current: function () { return idx; } };
})();

/* ---------- Thanh cong cu ---------- */
/* localStorage co the nem loi khi mo bang file:// hoac o che do an danh */
const store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bo qua */ } }
};

(function () {
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const saved = store.get('amcuoi-theme');
  if (saved) root.setAttribute('data-theme', saved);
  else root.removeAttribute('data-theme');

  themeBtn.addEventListener('click', function () {
    const now = root.getAttribute('data-theme');
    const isDark = now === 'dark' || (!now && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const nextTheme = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', nextTheme);
    store.set('amcuoi-theme', nextTheme);
    themeBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
  });

  const voiceSel = document.getElementById('voiceSel');
  Speech.onVoices(function (voices, current) {
    voiceSel.innerHTML = '';
    if (!voices.length) {
      voiceSel.appendChild(h('option', { text: 'Không có giọng tiếng Anh' }));
      voiceSel.disabled = true;
      return;
    }
    voiceSel.disabled = false;
    voices.forEach(function (v) {
      voiceSel.appendChild(h('option', { value: v.name, text: v.name.replace(/^(Microsoft|Google)\s+/, '') + ' (' + v.lang + ')' }));
    });
    if (current) voiceSel.value = current.name;
  });
  voiceSel.addEventListener('change', function () { Speech.setVoice(voiceSel.value); Speech.say('ending sounds'); });

  const rate = document.getElementById('rateSel');
  rate.addEventListener('input', function () {
    Speech.setRate(Number(rate.value));
    document.getElementById('rateVal').textContent = Number(rate.value).toFixed(2) + 'x';
  });

  if (!Speech.supported()) {
    document.getElementById('ttsWarn').style.display = 'block';
  }
})();
