<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking căn bản 1: Âm cuối</title>
<meta name="description" content="Bài giảng tương tác về năm âm cuối /t/, /d/, /k/, /s/, /z/ trong tiếng Anh: nghe mẫu, minigame và luyện đọc có ghi âm.">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="progress"><div class="progress__bar" id="progressBar"></div></div>

<header class="topbar">
  <div class="brand">
    <div class="brand__mark">âm</div>
    <div class="brand__txt">
      <div class="brand__t">Speaking căn bản 1: Âm cuối</div>
      <div class="brand__s">/t/ · /d/ · /k/ · /s/ · /z/</div>
    </div>
  </div>

  <label class="tool hide-sm" title="Giọng đọc mẫu">
    🎧
    <select id="voiceSel" class="tool" style="border:0;background:none;height:auto;padding:0"></select>
  </label>

  <label class="tool hide-sm" title="Tốc độ đọc">
    🐢
    <input id="rateSel" type="range" min="0.5" max="1.1" step="0.05" value="0.85" style="width:84px">
    <span id="rateVal">0.85x</span>
  </label>

  <button class="tool tool--icon" id="themeBtn" title="Đổi nền sáng tối" type="button">🌙</button>
  <button class="tool" id="menuBtn" type="button">☰ <span class="hide-sm">Mục lục</span></button>
</header>

<div id="ttsWarn" style="display:none;max-width:980px;margin:16px auto 0;padding:12px 16px;border-radius:14px;background:var(--no-soft);color:var(--no);font-weight:600;position:relative;z-index:2">
  Trình duyệt này không hỗ trợ đọc mẫu tự động. Hãy mở bài giảng bằng Chrome, Edge hoặc Safari để nghe được âm thanh.
</div>

<main id="deck" class="deck"></main>

<nav class="navbar">
  <button class="nav-btn" id="prev" type="button" aria-label="Slide trước">‹</button>
  <div class="dots" id="dots"></div>
  <span class="navpos" id="navpos">1 / 16</span>
  <button class="nav-btn" id="next" type="button" aria-label="Slide sau">›</button>
</nav>

<div class="menu" id="menu">
  <div class="menu__panel">
    <div class="menu__h">
      <b>Mục lục bài giảng</b>
      <button class="tool tool--icon" id="menuClose" type="button" aria-label="Đóng">✕</button>
    </div>
    <div id="menuList"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/games.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
